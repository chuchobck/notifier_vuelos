# Integración continua: en cada push y pull request a main, una base PostgreSQL 18 nueva con
# db/esquema_notificaciones.sql, y luego lint, formato, tipos, compilación y la suite e2e
# completa (que incluye la prueba de que contracts/notifier-openapi.json está al día). Aparte:
# los contratos de eventos (AsyncAPI válido y, en los pull requests, eventos:breaking contra la
# rama base) y la imagen de Docker, que tiene que construir y correr sin privilegios.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: lint, tipos, build y pruebas e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: notifier_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notifier_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notifier_db?schema=notificaciones
      NODE_ENV: test
      PORT: '3002'
      # Las pruebas fijan el resto (emisor, audiencia, una WEBHOOK_SECRET_KEY efímera y una
      # identidad falsa con su par RSA): test/utils/entorno-pruebas.ts. Aquí no hay secretos.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Dependencias (y cliente de Prisma)
        run: npm ci

      # El mismo archivo que db/reset.sh, con el psql 18 del contenedor
      - name: Esquema
        env:
          CONTENEDOR: ${{ job.services.postgres.id }}
        run: docker exec -i "$CONTENEDOR" psql -U postgres -d notifier_db -v ON_ERROR_STOP=1 -q < db/esquema_notificaciones.sql

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tipos (también test/)
        run: npm run typecheck

      - name: Compilación
        run: npm run build

      - name: Pruebas e2e
        run: npm test

  contratos:
    name: contratos de eventos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # eventos:breaking compara con la rama base: hace falta su historia
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: AsyncAPI válido (con sus $ref a contracts/events)
        run: |
          npx --yes @asyncapi/cli@6.2.1 config analytics --disable
          npx --yes @asyncapi/cli@6.2.1 validate contracts/asyncapi.yaml

      - name: Dependencias
        if: github.event_name == 'pull_request'
        run: npm ci

      - name: Esquemas compatibles con la rama base (eventos:breaking)
        if: github.event_name == 'pull_request'
        run: npm run eventos:breaking -- "origin/${{ github.base_ref }}"

  imagen:
    name: imagen de Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen (sin publicarla)
        run: docker build -t quinde-notifier:ci .

      - name: La imagen corre como usuario sin privilegios y trae los esquemas
        run: |
          test "$(docker run --rm --entrypoint id quinde-notifier:ci -u)" = "1000"
          test "$(docker run --rm --entrypoint sh quinde-notifier:ci -c 'ls contracts/events | wc -l')" = "12"
